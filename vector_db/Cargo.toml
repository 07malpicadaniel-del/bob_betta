[package]
name = "vector_db"
version = "0.1.0"
edition = "2021"

[dependencies]
# Concurrencia y estado
dashmap = "5.5"
parking_lot = "0.12"
rayon = "1.10"

# Serialización y persistencia
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Motor de Tensores y Embeddings Nativos en Rust (CPU / AVX-512)
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }
hf-hub = "0.4"

# Misceláneos
rand = "0.8"
