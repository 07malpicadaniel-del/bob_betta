[package]
name = "vector_db"
version = "0.1.0"
edition = "2021"

[dependencies]
# Concurrencia y estado
dashmap = "5.5"
parking_lot = "0.12"
rayon = "1.10"

# Serialización y persistencia
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cliente HTTP ligero
ureq = { version = "2.10", features = ["json"] }

# Misceláneos
rand = "0.8"
